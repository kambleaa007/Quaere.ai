services:
  - type: web
    name: quaere-ai
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      # Active provider — switch to "huggingface" or "llamacpp" as needed
      #   openai-compatible : Groq/TogetherAI/OpenAI (cloud, $0 with free tier)
      #   huggingface       : HF Inference API (needs Inference Endpoints, ~$9+/mo)
      #   llamacpp          : Local llama.cpp server (free, runs your own GGUF)
      #   ollama            : Local Ollama (free, development only)
      #   pollinations       : Pollinations text API (free, keyless)
      - key: AI_PROVIDER
        value: openai-compatible
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        fromSecret: GROQ_API_KEY
      # ── HuggingFace config (set AI_PROVIDER=huggingface to use) ──
      - key: HF_MODEL_ID
        value: kambleaa007/quaere-socratic
      - key: HF_API_KEY
        fromSecret: HF_API_KEY
      # ── llama.cpp config (set AI_PROVIDER=llamacpp to use) ──
      - key: LLAMA_CPP_URL
        value: http://localhost:8080
      - key: LLAMA_CPP_MODEL
        value: quaere-socratic-q4_k_m.gguf
      # ── Pollinations text config (set AI_PROVIDER=pollinations to use) ──
      - key: POLLINATIONS_MODEL
        value: openai-small
      - key: POLLINATIONS_API_KEY
        fromSecret: POLLINATIONS_API_KEY
      # ── Pollinations image config (used by Goddess Lalita image page) ──
      - key: LALITA_AI_PROVIDER
        value: pollinations
      - key: POLLINATIONS_IMAGE_MODEL
        value: flux
      - key: POLLINATIONS_VIDEO_MODEL
        value: seedance
      - key: SHIVA_AI_PROVIDER
        value: pollinations
    plan: free
