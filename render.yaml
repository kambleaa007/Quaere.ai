services:
  - type: web
    name: quaere-ai
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: AI_PROVIDER
        value: openai-compatible
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        fromSecret: GROQ_API_KEY
    plan: free
