<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ताण्डव | Quaere.ai</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Noto+Sans:wght@300;400&family=Noto+Sans:ital,wdth,opsz@0,100%,-devanagari,100..1200&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;500&display=swap');

      body {
        background-color: #121212;
        background-image: url('/imgs/Gemini_Generated_Tadava.png');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;
        font-family: 'Inter', sans-serif;
        color: #e8e6e1;
        position: relative;
        overflow: hidden;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, rgba(18, 18, 18, 0.85) 0%, rgba(18, 18, 18, 0.78) 100%);
        z-index: -1;
      }

      h1 {
        font-family: 'Playfair Display', serif;
      }

      .glow-amber {
        color: #f59e0b;
        text-shadow: 0 0 8px rgba(245, 158, 11, 0.6);
      }

      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(245, 158, 11, 0.3);
        border-radius: 3px;
      }

      .typing-cursor {
        animation: blink 1.1s steps(2, start) infinite;
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      .sanskrit-text {
        font-family: 'Noto Sans', sans-serif;
      }

      .content-section {
        flex: 1;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 2rem;
      }
    </style>
  </head>
  <body class="flex flex-col h-screen">
    <!-- Header -->
    <header class="border-b border-gray-800 px-6 py-4 flex items-center justify-between bg-gray-900/30 backdrop-blur-sm">
      <h1 class="text-2xl font-bold glow-amber">ताण्डव</h1>
      <!-- Navigation -->
      <nav class="flex space-x-4">
        <a href="/index.html" class="text-gray-400 hover:text-amber-300 font-medium text-sm transition-colors">Home</a>
        <a href="/goddess-lalita.html" class="text-gray-400 hover:text-amber-300 font-medium text-sm transition-colors">Vishwakarma</a>
        <a href="/lord-shiva.html" class="text-gray-400 hover:text-amber-300 font-medium text-sm transition-colors">Nataraj</a>
        <a href="/tandava.html" class="text-amber-400 hover:text-amber-300 font-medium text-sm transition-colors">ताण्डव</a>
      </nav>
      <span class="text-xs text-gray-500 font-light">Cosmic Dance</span>
    </header>

    <!-- Main content section - no prompts, no chat -->
    <main class="flex-1 flex items-center justify-center overflow-y-auto px-6 py-8 bg-gray-900/25">
      <div class="max-w-4xl mx-auto text-center">
        <p class="text-gray-400 text-lg font-light leading-relaxed mb-6">
          ताण्डव represents the cosmic dance of Lord Shiva - the rhythm of creation, preservation, and transformation.
        </p>
        <p class="text-gray-500 text-sm font-light leading-relaxed">
          This page is reserved for future exploration of the divine dance.
        </p>
      </div>
    </main>

    <!-- No footer/prompt area - clean page -->
  </body>
</html>
