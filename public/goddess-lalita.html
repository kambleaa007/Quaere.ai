<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vishwakarma | Quaere.ai</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;500&display=swap');

      body {
        background-color: #121212;
      background-image: url('/imgs/Vishwakarma.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
        font-family: 'Inter', sans-serif;
        color: #e8e6e1;
        position: relative;
        overflow: hidden;
      }

      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, rgba(18, 18, 18, 0.85) 0%, rgba(18, 18, 18, 0.78) 100%);
        z-index: -1;
      }

      h1 {
        font-family: 'Playfair Display', serif;
      }

      .glow-amber {
        color: #f59e0b;
        text-shadow: 0 0 8px rgba(245, 158, 11, 0.6);
      }

      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(245, 158, 11, 0.3);
        border-radius: 3px;
      }

      .typing-cursor {
        animation: blink 1.1s steps(2, start) infinite;
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      .generated-image {
        max-width: 100%;
        border-radius: 8px;
        margin: 12px 0;
        box-shadow: 0 4px 12px rgba(245, 158, 11, 0.2);
      }
    </style>
  </head>
  <body class="flex flex-col h-screen">
    <!-- Header -->
    <header class="border-b border-gray-800 px-6 py-4 flex items-center justify-between bg-gray-900/30 backdrop-blur-sm">
      <h1 class="text-2xl font-bold glow-amber">Vishwakarma</h1>
      <!-- Navigation -->
      <nav class="flex space-x-4">
        <a href="/index.html" class="text-gray-400 hover:text-amber-300 font-medium text-sm transition-colors">Home</a>
        <a href="/goddess-lalita.html" class="text-amber-400 hover:text-amber-300 font-medium text-sm transition-colors">Vishwakarma</a>
      <a href="/lord-shiva.html" class="text-gray-400 hover:text-amber-300 font-medium text-sm transition-colors">Nataraj</a>
      </nav>
      <span class="text-xs text-gray-500 font-light">Divine Vision</span>
    </header>

    <!-- Chat log -->
    <main id="chat-log" class="flex-1 overflow-y-auto px-6 py-8 space-y-6 bg-gray-900/25">
      <!-- Welcome message -->
      <div class="max-w-3xl mx-auto">
        <p class="text-gray-400 text-sm font-light leading-relaxed">
          I am Vishwakarma's visionary interpreter. Share your thoughts, and I will conjure images that reflect your inner truth.
        </p>
      </div>
    </main>

    <!-- Input area -->
    <footer class="border-t border-gray-800 px-6 py-4 bg-gray-900/30 backdrop-blur-sm">
      <div class="max-w-3xl mx-auto">
        <div class="relative">
          <textarea
            id="input-box"
            placeholder="What vision calls to you?"
            rows="1"
            class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-sm text-[#e8e6e1] placeholder-gray-500 resize-none focus:outline-none focus:border-amber-500/50 focus:ring-1 focus:ring-amber-500/30 transition-colors duration-200"
          ></textarea>
          <button
            id="send-btn"
            class="absolute right-3 top-1/2 -translate-y-1/2 bg-amber-500 hover:bg-amber-400 text-[#121212] font-medium py-1.5 px-3 rounded-md text-sm transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
            disabled
          >
            Generate
          </button>
        </div>
        <p class="text-xs text-gray-600 mt-2 text-center">
          Press <span class="text-gray-500">Enter</span> to generate, <span class="text-gray-500">Esc</span> to reset.
        </p>
      </div>
    </footer>

    <script src="goddess-lalita.js"></script>
  </body>
</html>
