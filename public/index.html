<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quaere.ai</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Noto+Sans:wght@300;400&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;500&display=swap');

    body {
      background-color: #121212;
      background-image: url('/imgs/ganesha-writing-book.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      font-family: 'Inter', sans-serif;
      color: #e8e6e1;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, rgba(18, 18, 18, 0.85) 0%, rgba(18, 18, 18, 0.78) 100%);
      z-index: -1;
    }

    h1 {
      font-family: 'Playfair Display', serif;
    }

    .translate-sanskrit-btn {
      background: linear-gradient(45deg, #f59e0b, #d97706);
      color: #121212;
      font-weight: 600;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
      transition: all 0.3s ease;
    }

    .translate-sanskrit-btn:hover {
      background: linear-gradient(45deg, #fbbf24, #f59e0b);
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.6);
      transform: scale(1.05);
    }

    .sanskrit-text {
      font-family: 'Noto Sans', sans-serif;
    }
 
    .glow-amber {
      color: #f59e0b;
      text-shadow: 0 0 8px rgba(245, 158, 11, 0.6);
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(245, 158, 11, 0.3);
      border-radius: 3px;
    }

    .typing-cursor {
      animation: blink 1.1s steps(2, start) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }
  </style>
</head>
<body class="flex flex-col h-screen">
  <!-- Header -->
  <header class="border-b border-gray-800 px-6 py-4 flex items-center justify-between bg-gray-900/30 backdrop-blur-sm">
    <h1 class="text-2xl font-bold glow-amber">Quaere.ai</h1>
    <!-- Navigation -->
    <nav class="flex space-x-4">
      <a href="/index.html" class="text-amber-400 hover:text-amber-300 font-medium text-sm transition-colors">Home</a>
      <a href="/goddess-lalita.html" class="text-gray-400 hover:text-amber-300 font-medium text-sm transition-colors">Vishwakarma</a>
      <a href="/lord-shiva.html" class="text-gray-400 hover:text-amber-300 font-medium text-sm transition-colors">Nataraj</a>
      <a href="/aarambha.html" class="text-gray-400 hover:text-amber-300 font-medium text-sm transition-colors">Aarambha</a>
    </nav>
    <span class="text-xs text-gray-500 font-light">Socratic Intelligence</span>
  </header>

  <!-- Chat log -->
  <main id="chat-log" class="flex-1 overflow-y-auto px-6 py-8 space-y-6 bg-gray-900/25">
    <!-- Welcome message -->
    <div class="max-w-3xl mx-auto">
      <p class="text-gray-400 text-sm font-light leading-relaxed">
        I am Quaere.ai — a Socratic interlocutor. I will not answer your questions directly.
        Instead, I will meet you wherever you are, and ask the questions that lead you to your own clarity.
      </p>
    </div>
  </main>

  <!-- Input area -->
  <footer class="border-t border-gray-800 px-6 py-4 bg-gray-900/30 backdrop-blur-sm">
    <div class="max-w-3xl mx-auto">
      <div class="relative">
        <textarea
          id="input-box"
          placeholder="What troubles your mind?"
          rows="1"
          class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 text-sm text-[#e8e6e1] placeholder-gray-500 resize-none focus:outline-none focus:border-amber-500/50 focus:ring-1 focus:ring-amber-500/30 transition-colors duration-200"
        ></textarea>
        <button
          id="send-btn"
          class="absolute right-3 top-1/2 -translate-y-1/2 bg-amber-500 hover:bg-amber-400 text-[#121212] font-medium py-1.5 px-3 rounded-md text-sm transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
          disabled
        >
          Send
        </button>
      </div>
      <p class="text-xs text-gray-600 mt-2 text-center">
        Press <span class="text-gray-500">Enter</span> to send, <span class="text-gray-500">Esc</span> to reset.
      </p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
